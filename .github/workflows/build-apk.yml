name: Build Android APK (TWA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate TWA Config and Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "password123"
          BUBBLEWRAP_KEY_PASSWORD: "password123"
        run: |
          mkdir -p build-twa && cd build-twa

          # 1. Настройка путей JDK и Android SDK для Bubblewrap
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

          # 2. Создание keystore для подписи
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "password123" \
            -keypass "password123" \
            -dname "CN=ScannerPro, OU=Scanner, O=Scanner, L=City, S=State, C=RU"

          # 3. Автогенерация twa-manifest.json
          REPO_NAME="${{ github.event.repository.name }}"
          USER_NAME="${{ github.repository_owner }}"

          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.${USER_NAME}.${REPO_NAME}",
            "host": "${USER_NAME}.github.io",
            "name": "DataMatrix Scanner Pro",
            "launcherName": "Scanner",
            "themeColor": "#0d1117",
            "navigationColor": "#0d1117",
            "backgroundColor": "#0d1117",
            "startUrl": "/${REPO_NAME}/index.html",
            "iconUrl": "https://${USER_NAME}.github.io/${REPO_NAME}/icon-512.png",
            "maskableIconUrl": "https://${USER_NAME}.github.io/${REPO_NAME}/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://${USER_NAME}.github.io/${REPO_NAME}/manifest.json",
            "fallbackType": "customtabs",
            "enableNotifications": false,
            "features": {
              "locationDelegation": { "enabled": false },
              "playBilling": { "enabled": false }
            },
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false
          }
          EOF

          # 4. Сборка APK с переданными переменными паролей
          bubblewrap build --skipPwaValidation --signingKeyPath=./android.keystore --signingKeyAlias=android

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ScannerPro-Release-APK
          path: build-twa/app-release-signed.apk
          if-no-files-found: warn
