<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GS1 DataMatrix Scanner Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-main: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.25);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Верхняя панель */
    header {
      padding: env(safe-area-inset-top, 8px) 14px 8px 14px;
      background: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .brand-badge {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .counter-badge {
      background: #1f2937;
      border: 1px solid var(--card-border);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .counter-badge span {
      color: var(--success);
      font-weight: 700;
      font-size: 0.88rem;
    }

    /* Контейнер камеры - строго зажат между шапкой и панелью */
    #camera-container {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Видео не распирает контейнер */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Прицел */
    .overlay-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 62vw;
      max-width: 220px;
      height: 62vw;
      max-height: 220px;
      border-radius: 18px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      z-index: 5;
    }

    .corner-tl, .corner-tr, .corner-bl, .corner-br {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #3b82f6;
      border-style: solid;
      pointer-events: none;
      z-index: 6;
    }

    .corner-tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 16px; }
    .corner-tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 16px; }
    .corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 16px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 16px; }

    .scan-laser {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #60a5fa, #3b82f6, #60a5fa, transparent);
      box-shadow: 0 0 10px #3b82f6;
      animation: scanLaserAnim 2s ease-in-out infinite alternate;
      z-index: 5;
    }

    @keyframes scanLaserAnim {
      0% { top: 6%; }
      100% { top: 94%; }
    }

    /* Нижняя панель управления - строго на виду */
    #controls {
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 8px)) 14px;
      background: rgba(13, 17, 23, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      border-top: 1px solid var(--card-border);
      z-index: 20;
    }

    .mode-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 10px;
    }

    .mode-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .mode-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 0.8rem;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #374151;
      transition: 0.25s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: 0.25s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }

    #result-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 10px;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      min-height: 42px;
      max-height: 52px;
      font-size: 0.78rem;
      line-height: 1.3;
      overflow-y: auto;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .status-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .success-alert {
      background: rgba(16, 185, 129, 0.12) !important;
      border-color: rgba(16, 185, 129, 0.4) !important;
      color: #34d399 !important;
    }

    .duplicate-alert {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: rgba(239, 68, 68, 0.45) !important;
      color: #f87171 !important;
    }

    .invalid-alert {
      background: rgba(245, 158, 11, 0.15) !important;
      border-color: rgba(245, 158, 11, 0.45) !important;
      color: #fbbf24 !important;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 12px 14px;
      font-size: 0.9rem;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:active { 
      transform: scale(0.98);
      opacity: 0.9; 
    }

    #toggle-btn { 
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 4px 10px var(--accent-glow);
    }

    #toggle-btn.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 10px var(--danger-glow);
    }

    #download-btn { 
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 10px var(--success-glow);
      display: none; 
    }

    #clear-btn { 
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: #e5e7eb;
      display: none; 
      max-width: 70px; 
    }

    /* Модальные окна */
    #update-modal, #success-toast {
      position: fixed;
      top: max(env(safe-area-inset-top, 10px), 10px);
      left: 12px;
      right: 12px;
      border-radius: 12px;
      padding: 10px 14px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      animation: slideInDown 0.3s ease-out;
    }

    #update-modal {
      background: #1e293b;
      border: 1px solid #3b82f6;
      justify-content: space-between;
    }

    #success-toast {
      background: #065f46;
      border: 1px solid #10b981;
      color: #fff;
    }

    @keyframes slideInDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .toast-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toast-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }

    .toast-desc {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.8);
    }

    #update-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      padding: 7px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      flex: 0 0 auto;
    }
  </style>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>

  <!-- Окно предложения обновить -->
  <div id="update-modal">
    <div class="toast-content">
      <div class="toast-title">✨ Доступна новая версия!</div>
      <div class="toast-desc">Нажмите для применения обновления</div>
    </div>
    <button id="update-btn">Установить</button>
  </div>

  <!-- Уведомление об успешном обновлении -->
  <div id="success-toast">
    <div style="font-size: 1.2rem;">🎉</div>
    <div class="toast-content">
      <div class="toast-title">Приложение обновлено!</div>
      <div class="toast-desc">Все новые функции активированы</div>
    </div>
  </div>

  <header>
    <div class="brand">
      <div class="brand-badge">GS1</div>
      <span>DataMatrix Pro</span>
    </div>
    <div class="counter-badge" id="counter-box">
      Кодов: <span id="counter-val">0</span>
    </div>
  </header>

  <div id="camera-container">
    <video id="video" autoplay muted playsinline></video>
    <div class="overlay-frame">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <div class="scan-laser"></div>
    </div>
  </div>

  <div id="controls">
    <div class="mode-card">
      <div class="mode-label">
        <div class="mode-icon">⚡</div>
        <span>Накопительный режим</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="batch-mode">
        <span class="slider"></span>
      </label>
    </div>
    
    <div id="result-box">Нажмите «Запустить сканер» для начала работы</div>

    <div class="btn-group">
      <button id="clear-btn">Сброс</button>
      <button id="toggle-btn">Запустить сканер</button>
      <button id="download-btn">Скачать .TXT</button>
    </div>
  </div>

  <script>
    function checkUpdateSuccess() {
      if (localStorage.getItem('pwa_app_updated') === '1') {
        localStorage.removeItem('pwa_app_updated');
        const toast = document.getElementById('success-toast');
        toast.style.display = 'flex';
        
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        setTimeout(() => {
          toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-100%)';
          setTimeout(() => toast.style.display = 'none', 400);
        }, 3500);
      }
    }

    checkUpdateSuccess();

    let newWorker;
    const updateModal = document.getElementById('update-modal');
    const updateBtn = document.getElementById('update-btn');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update();

        reg.addEventListener('updatefound', () => {
          newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              updateModal.style.display = 'flex';
            }
          });
        });
      }).catch(console.error);

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          localStorage.setItem('pwa_app_updated', '1');
          window.location.reload();
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          navigator.serviceWorker.getRegistration().then((reg) => {
            if (reg) reg.update();
          });
        }
      });
    }

    updateBtn.addEventListener('click', () => {
      localStorage.setItem('pwa_app_updated', '1');
      if (newWorker) {
        newWorker.postMessage({ action: 'SKIP_WAITING' });
      } else {
        window.location.reload();
      }
    });

    const codeReader = new ZXing.BrowserMultiFormatReader();
    const videoElem = document.getElementById('video');
    const resultBox = document.getElementById('result-box');
    const toggleBtn = document.getElementById('toggle-btn');
    const downloadBtn = document.getElementById('download-btn');
    const clearBtn = document.getElementById('clear-btn');
    const batchModeCheck = document.getElementById('batch-mode');
    const counterVal = document.getElementById('counter-val');

    let scanning = false;
    let scannedCodes = [];
    let lastScannedCode = '';
    let lastScanTime = 0;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function isGS1Code(raw) {
      if (!raw || typeof raw !== 'string') return false;
      let clean = raw.replace(/[\x00-\x1F\x7F]/g, "").trim();
      return /^01\d{14}21.+$/.test(clean);
    }

    function cleanGS1Crypto(raw) {
      if (!raw) return "";

      let text = raw;
      for (let i = 0; i < 32; i++) {
        const char = String.fromCharCode(i);
        if (text.includes(char)) {
          text = text.split(char).filter(Boolean).filter(part => 
            !part.startsWith("91") && 
            !part.startsWith("92") && 
            !part.startsWith("93") && 
            !part.startsWith("8005")
          ).join("");
        }
      }

      if (text.startsWith("01") && text.length > 18) {
        const gtinPrefix = text.substring(0, 16);
        const ai21 = text.substring(16, 18);

        if (ai21 === "21") {
          let serialAndTail = text.substring(18);

          if (serialAndTail.length > 6) {
            const checkPos = serialAndTail.length - 6;
            if (serialAndTail.substring(checkPos, checkPos + 2) === "93") {
              return gtinPrefix + "21" + serialAndTail.substring(0, checkPos);
            }
          }

          const idx91 = serialAndTail.lastIndexOf("91");
          if (idx91 > 0 && (serialAndTail.length - idx91) >= 4) {
            return gtinPrefix + "21" + serialAndTail.substring(0, idx91);
          }

          const idx92 = serialAndTail.lastIndexOf("92");
          if (idx92 > 0 && (serialAndTail.length - idx92) >= 4) {
            return gtinPrefix + "21" + serialAndTail.substring(0, idx92);
          }
        }
      }

      return text.replace(/[\x00-\x1F\x7F]/g, "").trim();
    }

    function updateUI() {
      counterVal.textContent = scannedCodes.length;
      if (batchModeCheck.checked) {
        downloadBtn.style.display = scannedCodes.length > 0 ? 'flex' : 'none';
        clearBtn.style.display = scannedCodes.length > 0 ? 'flex' : 'none';
      } else {
        downloadBtn.style.display = 'none';
        clearBtn.style.display = 'none';
      }
    }

    batchModeCheck.addEventListener('change', () => {
      if (!batchModeCheck.checked && scannedCodes.length > 0) {
        if (!confirm('Выключение накопительного режима сбросит текущие коды. Продолжить?')) {
          batchModeCheck.checked = true;
          return;
        }
        scannedCodes = [];
        lastScannedCode = '';
        resultBox.className = '';
        resultBox.innerHTML = 'Нажмите «Запустить сканер» для начала работы';
      }
      updateUI();
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Очистить все отсканированные коды?')) {
        scannedCodes = [];
        lastScannedCode = '';
        resultBox.className = '';
        resultBox.innerHTML = 'Список очищен. Готов к сканированию.';
        updateUI();
      }
    });

    async function startScan() {
      try {
        scanning = true;
        toggleBtn.textContent = 'Остановить';
        toggleBtn.classList.add('active');

        const hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        await codeReader.decodeFromVideoDevice(undefined, videoElem, (result, err) => {
          if (result) {
            const now = Date.now();
            const rawText = result.getText();

            if (!isGS1Code(rawText)) {
              if (rawText !== lastScannedCode || (now - lastScanTime > 1500)) {
                lastScanTime = now;
                lastScannedCode = rawText;
                
                if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
                resultBox.className = 'invalid-alert';
                resultBox.innerHTML = `<span class="status-badge">⚠️ Не GS1 маркировка</span><div>${escapeHtml(rawText)}</div>`;
              }
              return;
            }

            const finalCode = cleanGS1Crypto(rawText);

            if (batchModeCheck.checked) {
              if (finalCode === lastScannedCode && (now - lastScanTime < 1500)) {
                return; 
              }
              
              lastScanTime = now;
              lastScannedCode = finalCode;

              if (scannedCodes.includes(finalCode)) {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                
                resultBox.className = 'duplicate-alert';
                resultBox.innerHTML = `<span class="status-badge">⛔ Дубликат! Код уже добавлен</span><div>${escapeHtml(finalCode)}</div>`;
                return;
              }
              
              scannedCodes.push(finalCode);
              if (navigator.vibrate) navigator.vibrate(80);
              
              resultBox.className = 'success-alert';
              resultBox.innerHTML = `<span class="status-badge">✅ [№${scannedCodes.length}] Успешно добавлен</span><div>${escapeHtml(finalCode)}</div>`;
              resultBox.scrollTop = resultBox.scrollHeight;
              updateUI();
              
            } else {
              if (navigator.vibrate) navigator.vibrate(80);
              resultBox.className = 'success-alert';
              resultBox.innerHTML = `<span class="status-badge">✅ GS1 DataMatrix</span><div>${escapeHtml(finalCode)}</div>`;
            }
          }
        });
      } catch (err) {
        resultBox.textContent = 'Ошибка камеры: ' + err.message;
        stopScan();
      }
    }

    function stopScan() {
      scanning = false;
      codeReader.reset();
      toggleBtn.textContent = 'Запустить сканер';
      toggleBtn.classList.remove('active');
    }

    toggleBtn.addEventListener('click', () => {
      if (scanning) stopScan();
      else startScan();
    });

    downloadBtn.addEventListener('click', () => {
      if (scannedCodes.length === 0) return;
      
      const linesWithNumbers = scannedCodes.map((code, index) => `${index + 1};${code}`);
      const fileContent = linesWithNumbers.join('\r\n');
      
      const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
      
      const now = new Date();
      const dateStr = now.toISOString().slice(0,10);
      const timeStr = now.toTimeString().slice(0,8).replace(/:/g, '-');
      const filename = `gs1_codes_${dateStr}_${timeStr}.txt`;
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
