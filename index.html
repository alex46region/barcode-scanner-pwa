<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер Кодов</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px;
      text-align: center;
      background: #1e1e1e;
      font-size: 1.1rem;
      font-weight: bold;
    }
    #camera-container {
      position: relative;
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      width: 70%;
      max-width: 280px;
      aspect-ratio: 1;
      border: 2px dashed rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }
    #controls {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      background: #1976d2;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #1565c0; }
    #result-box {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      font-family: monospace;
      min-height: 48px;
      font-size: 0.95rem;
    }
  </style>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>

  <header>Сканер ШК & DataMatrix</header>

  <div id="camera-container">
    <video id="video" autoplay muted playsinline></video>
    <div class="overlay"></div>
  </div>

  <div id="controls">
    <div id="result-box">Нажмите «Старт» и наведите камеру на код</div>
    <button id="toggle-btn">Запустить камеру</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    const codeReader = new ZXing.BrowserMultiFormatReader();
    const videoElem = document.getElementById('video');
    const resultBox = document.getElementById('result-box');
    const toggleBtn = document.getElementById('toggle-btn');

    let scanning = false;

    async function startScan() {
      try {
        scanning = true;
        toggleBtn.textContent = 'Остановить';
        toggleBtn.style.background = '#d32f2f';

        const hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        await codeReader.decodeFromVideoDevice(undefined, videoElem, (result, err) => {
          if (result) {
            resultBox.innerHTML = `<strong>Формат:</strong> ${result.getBarcodeFormat()}<br><strong>Данные:</strong> ${result.getText()}`;
            if (navigator.vibrate) navigator.vibrate(100);
          }
        });
      } catch (err) {
        resultBox.textContent = 'Ошибка доступа к камере: ' + err.message;
        stopScan();
      }
    }

    function stopScan() {
      scanning = false;
      codeReader.reset();
      toggleBtn.textContent = 'Запустить камеру';
      toggleBtn.style.background = '#1976d2';
    }

    toggleBtn.addEventListener('click', () => {
      if (scanning) stopScan();
      else startScan();
    });
  </script>
</body>
</html>
