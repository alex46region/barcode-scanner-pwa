<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер Кодов Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 16px;
      text-align: center;
      background: #1e1e1e;
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
      border-bottom: 1px solid #2d2d2d;
    }

    #camera-container {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      width: 65%;
      max-width: 240px;
      aspect-ratio: 1;
      border: 2px dashed #1976d2;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
    }

    #controls {
      padding: 12px 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid #2d2d2d;
    }

    .mode-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { 
      opacity: 0; 
      width: 0; 
      height: 0; 
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #555;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { 
      background-color: #1976d2; 
    }
    
    input:checked + .slider:before { 
      transform: translateX(20px); 
    }

    #session-info {
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
    }

    #result-box {
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-all;
      font-family: monospace;
      min-height: 48px;
      max-height: 70px;
      font-size: 0.85rem;
      overflow-y: auto;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #toggle-btn { background: #1976d2; }
    #download-btn { background: #388e3c; display: none; }
    #clear-btn { background: #555; display: none; max-width: 75px; }
    button:active { opacity: 0.8; }
  </style>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>

  <header>Сканер ШК & DataMatrix</header>

  <div id="camera-container">
    <video id="video" autoplay muted playsinline></video>
    <div class="overlay"></div>
  </div>

  <div id="controls">
    <div class="mode-setting">
      <span>Накопительный режим (Сессия)</span>
      <label class="switch">
        <input type="checkbox" id="batch-mode">
        <span class="slider"></span>
      </label>
    </div>
    
    <div id="session-info">Режим: Одиночное сканирование</div>
    <div id="result-box">Нажмите «Запустить камеру»</div>

    <div class="btn-group">
      <button id="clear-btn">Сброс</button>
      <button id="toggle-btn">Запустить камеру</button>
      <button id="download-btn">Скачать .TXT</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    const codeReader = new ZXing.BrowserMultiFormatReader();
    const videoElem = document.getElementById('video');
    const resultBox = document.getElementById('result-box');
    const toggleBtn = document.getElementById('toggle-btn');
    const downloadBtn = document.getElementById('download-btn');
    const clearBtn = document.getElementById('clear-btn');
    const batchModeCheck = document.getElementById('batch-mode');
    const sessionInfo = document.getElementById('session-info');

    let scanning = false;
    let scannedCodes = [];
    let lastScannedCode = '';
    let lastScanTime = 0;

    // Безопасное экранирование для корректного отображения спецсимволов (<, >, &)
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Очистка криптохвоста GS1 (Честный Знак: теги 91, 92, 93)
    function cleanGS1Crypto(text) {
      let clean = text;
      
      // Вариант 1: Разделитель GS (ASCII 29 / \x1d) присутствует в потоке данных
      if (clean.includes(String.fromCharCode(29))) {
        const parts = clean.split(String.fromCharCode(29));
        let rebuilt = '';
        for (let part of parts) {
          // Если часть начинается с тега криптохвоста (91, 92, 93) - прерываем сборку
          if (part.startsWith('91') || part.startsWith('92') || part.startsWith('93')) {
            break;
          }
          rebuilt += part;
        }
        return rebuilt.replace(/[\x00-\x1F\x7F]/g, "").trim();
      } 
      
      // Вариант 2: Слитная строка без управляющих символов ASCII 29
      // Структура Честного Знака: 01 (2 знака) + GTIN (14 знаков) + 21 (2 знака) + Серийный номер + Хвост
      const gs1Regex = /^(01\d{14}21)(.+)$/;
      const match = clean.match(gs1Regex);
      
      if (match) {
        const prefix = match[1]; // 01...21
        let rest = match[2];     // Серийный номер + криптохвост
        
        // Для воды/молока/пива/табака криптохвост часто: 93 + 4 символа (всего 6 символов в конце)
        if (rest.length > 6 && rest.slice(-6, -4) === '93') {
          rest = rest.slice(0, -6);
          return (prefix + rest).replace(/[\x00-\x1F\x7F]/g, "").trim();
        }
        
        // Для обуви/одежды/фармы: отсечение по идентификаторам 91 или 92
        const idx91 = rest.lastIndexOf('91');
        if (idx91 !== -1 && (idx91 === 6 || idx91 === 7 || idx91 === 13)) {
          rest = rest.substring(0, idx91);
          return (prefix + rest).replace(/[\x00-\x1F\x7F]/g, "").trim();
        }
        
        const idx92 = rest.lastIndexOf('92');
        if (idx92 !== -1 && (idx92 === 6 || idx92 === 7 || idx92 === 13)) {
          rest = rest.substring(0, idx92);
          return (prefix + rest).replace(/[\x00-\x1F\x7F]/g, "").trim();
        }
      }
      
      // Удаляем возможные управляющие символы ASCII (0-31)
      return clean.replace(/[\x00-\x1F\x7F]/g, "").trim();
    }

    function updateUI() {
      if (batchModeCheck.checked) {
        sessionInfo.textContent = `В текущей сессии кодов: ${scannedCodes.length}`;
        downloadBtn.style.display = scannedCodes.length > 0 ? 'block' : 'none';
        clearBtn.style.display = scannedCodes.length > 0 ? 'block' : 'none';
      } else {
        sessionInfo.textContent = 'Режим: Одиночное сканирование';
        downloadBtn.style.display = 'none';
        clearBtn.style.display = 'none';
      }
    }

    batchModeCheck.addEventListener('change', () => {
      if (!batchModeCheck.checked && scannedCodes.length > 0) {
        if (!confirm('Выключение режима очистит текущую сессию. Продолжить?')) {
          batchModeCheck.checked = true;
          return;
        }
        scannedCodes = [];
        lastScannedCode = '';
      }
      updateUI();
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Очистить текущую сессию сканирования?')) {
        scannedCodes = [];
        lastScannedCode = '';
        resultBox.textContent = 'Сессия очищена. Готов к работе.';
        updateUI();
      }
    });

    async function startScan() {
      try {
        scanning = true;
        toggleBtn.textContent = 'Остановить';
        toggleBtn.style.background = '#d32f2f';

        const hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        await codeReader.decodeFromVideoDevice(undefined, videoElem, (result, err) => {
          if (result) {
            const now = Date.now();
            const rawText = result.getText();
            const format = result.getBarcodeFormat();
            
            // Очищаем код от криптохвоста
            let finalCode = rawText;
            if (format === 'DATA_MATRIX' || rawText.startsWith('01')) {
              finalCode = cleanGS1Crypto(rawText);
            }

            if (batchModeCheck.checked) {
              // Защита от дублей при удержании камеры (2 сек интервал)
              if (finalCode === lastScannedCode && (now - lastScanTime < 2000)) {
                return; 
              }
              
              lastScannedCode = finalCode;
              lastScanTime = now;
              
              scannedCodes.push(finalCode);
              if (navigator.vibrate) navigator.vibrate(100);
              
              // Безопасная вставка через escapeHtml
              resultBox.innerHTML = `<strong>[№${scannedCodes.length}] Добавлен:</strong><br>${escapeHtml(finalCode)}`;
              resultBox.scrollTop = resultBox.scrollHeight;
              updateUI();
            } else {
              if (navigator.vibrate) navigator.vibrate(100);
              resultBox.innerHTML = `<strong>Формат:</strong> ${format}<br><strong>Код:</strong> ${escapeHtml(finalCode)}`;
            }
          }
        });
      } catch (err) {
        resultBox.textContent = 'Ошибка камеры: ' + err.message;
        stopScan();
      }
    }

    function stopScan() {
      scanning = false;
      codeReader.reset();
      toggleBtn.textContent = 'Запустить камеру';
      toggleBtn.style.background = '#1976d2';
    }

    toggleBtn.addEventListener('click', () => {
      if (scanning) stopScan();
      else startScan();
    });

    // Экспорт кодов в .txt файл
    downloadBtn.addEventListener('click', () => {
      if (scannedCodes.length === 0) return;
      
      const fileContent = scannedCodes.join('\r\n');
      const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
      
      const now = new Date();
      const dateStr = now.toISOString().slice(0,10);
      const timeStr = now.toTimeString().slice(0,8).replace(/:/g, '-');
      const filename = `session_${dateStr}_${timeStr}.txt`;
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
